<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
    <title>Game Map</title>
    <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#9e9482">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="Game Map"
>

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Teko:wght@500;600;700&display=swap"
    rel="stylesheet"
>
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div id="map"></div>
    
    <div id="searchBox">

    <input
        id="searchInput"
        type="text"
        placeholder="Nereye?"
        autocomplete="off"
    >

    <button id="searchButton">
        ARA
    </button>

    <button id="routeButton">
        ROTA
    </button>

    <div id="searchResults"></div>

</div>


<div id="routeInfo">

    <span id="routeTime">
        -- dk
    </span>

    <span>•</span>

    <span id="routeDistance">
        -- km
    </span>

</div>


<div id="navigationInstruction">

    <span id="navigationArrow"></span>

    <div id="navigationWords">

    <span id="navigationDistance"></span>

    <span id="navigationAction"></span>

    <span id="navigationRoad"></span>

</div>
<div id="speedHud">

    <span id="speedValue">
        0
    </span>

    <span id="speedUnit">
        KM/H
    </span>

</div>
</div>
    
    <button id="locationButton">KONUMUM</button>

    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

    <script src="app.js"></script>

</body>

</html>
